# ── Netlify configuration for A Vyza Ventures ──────────────────────────────
# Security headers applied to every route

[[headers]]
  for = "/*"
  [headers.values]

    # Prevent clickjacking — only allow this page to be framed by itself
    X-Frame-Options = "SAMEORIGIN"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Control referrer info sent to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable browser features not needed by the site
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

    # Content Security Policy
    # Note: 'unsafe-inline' is required because the site uses inline <script> and <style> blocks.
    # If you ever migrate to external JS/CSS files, remove 'unsafe-inline' for a stricter policy.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline';
      style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self' https://formspree.io;
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self' https://formspree.io;
    """

    # CORS — no wildcard. Only allow same-origin requests.
    Access-Control-Allow-Origin = "https://avyzaventures.netlify.app"
    Access-Control-Allow-Methods = "GET, POST"
    Access-Control-Allow-Headers = "Content-Type"

# ── Cache static assets aggressively, HTML never cached ─────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.JPG"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
